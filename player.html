<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديو</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; outline: none; }
    </style>
</head>
<body>
    <video id="video" controls autoplay playsinline></video>
    <script>
        var originalUrl = 'http://neo-aps.me/live/Mirza765/97fdfde3c8/264012.m3u8';
        var videoSrc = 'https://corsproxy.io/?' + encodeURIComponent(originalUrl);
        var video = document.getElementById('video');

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() { video.play(); });
        }
    </script>
</body>
</html>
