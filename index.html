<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ezidisport live</title>

  <!-- HLS.js للبث المباشر -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- خط Tajawal لتصميم أنيق -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* منع تعارض الستايل مع قوالب بلوجر الافتراضية */
    .ez-wrap, .ez-wrap * {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif !important;
    }

    .ez-wrap {
      color-scheme: dark;
      color: #f1f5f9;
      background: #070a12;
      background-image: 
        radial-gradient(circle at 80% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
      min-height: 100vh;
      padding: 20px 10px 40px;
      direction: rtl;
      text-align: right;
    }

    .ez-wrap button, .ez-wrap input { font: inherit; }

    .ez-container {
      width: min(1180px, 100%);
      margin: auto;
    }

    .ez-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ez-brand {
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
      font-weight: 900;
    }

    .ez-brand span {
      color: #10b981;
    }

    .ez-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .ez-pulse {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: ez-pulse 1.6s infinite;
    }

    @keyframes ez-pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .ez-card {
      padding: 20px;
      background: rgba(18, 26, 43, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    #ezLogin {
      width: min(380px, 100%);
      margin: 8vh auto;
      text-align: center;
    }

    #ezLogin h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .ez-sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }

    .ez-wrap input {
      width: 100%;
      margin-bottom: 14px;
      padding: 12px 16px;
      color: #fff;
      background: rgba(10, 15, 26, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
    }

    .ez-wrap input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .ez-primary-btn {
      width: 100%;
      padding: 12px;
      color: #04110e;
      background: #10b981;
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .ez-primary-btn:hover { background: #34d399; }

    #ezError {
      min-height: 1.4em;
      margin: 10px 0 0;
      color: #f87171;
      font-size: 0.85rem;
    }

    #ezApp { display: none; }

    .ez-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 20px;
      align-items: start;
    }

    .ez-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 14px;
    }

    .ez-player {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
    }

    .ez-player.rotated {
      transform: rotate(90deg);
      transform-origin: center center;
    }

    .ez-player video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .ez-player video::-webkit-media-controls { display: none !important; }

    .ez-channel-logo {
      position: absolute;
      z-index: 4;
      top: 14px;
      right: 14px;
      width: clamp(45px, 7vw, 85px);
      max-height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
      pointer-events: none;
    }

    .ez-live-badge {
      position: absolute;
      z-index: 4;
      top: 14px;
      left: 14px;
      padding: 5px 10px;
      color: #fff;
      background: rgba(220, 38, 38, 0.9);
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
    }
    .ez-live-badge span { width: 5px; height: 5px; background: #fff; border-radius: 50%; }

    .ez-controls {
      position: absolute;
      z-index: 5;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
      opacity: 1;
      visibility: visible;
      transition: 0.3s;
    }

    .ez-player.controls-hidden .ez-controls {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .ez-icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
    }

    .ez-icon-btn:hover { background: #10b981; color: #000; border-color: #10b981; }

    .ez-icon-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ez-msg {
      flex: 1;
      min-width: 0;
      color: #e2e8f0;
      font-size: 0.85rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ez-channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
    }

    .ez-channel-list::-webkit-scrollbar { width: 4px; }
    .ez-channel-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    .ez-ch-btn {
      width: 100%;
      padding: 12px;
      color: #fff;
      text-align: right;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ez-ch-btn:hover { background: rgba(255, 255, 255, 0.07); }
    .ez-ch-btn.active { background: rgba(16, 185, 129, 0.15); border-color: #10b981; }
    .ez-ch-btn.active span { color: #10b981; font-weight: 700; }
    .ez-ch-btn:disabled { color: #64748b; cursor: not-allowed; opacity: 0.6; }
    .ez-ch-btn small { color: #94a3b8; font-size: 0.75rem; }

    .ez-logout {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .ez-hint { color: #94a3b8; font-size: 0.8rem; margin-top: 10px; }
    .ez-footer { margin-top: 24px; color: #94a3b8; text-align: center; font-size: 0.8rem; }

    @media (max-width: 800px) {
      .ez-layout { grid-template-columns: 1fr; }
    }
  </style>

  <div class="ez-wrap">
    <div class="ez-container">
      <header class="ez-header">
        <div class="ez-brand">ezidisport <span>live</span></div>
        <div class="ez-badge">
          <span class="ez-pulse"></span> بث مباشر
        </div>
      </header>

      <!-- نموذج الدخول -->
      <section id="ezLogin" class="ez-card">
        <h1>مرحبًا بك</h1>
        <p class="ez-sub">أدخل رمز الدخول لمشاهدة القنوات</p>

        <form id="ezLoginForm">
          <input
            id="ezPasscode"
            type="password"
            inputmode="numeric"
            placeholder="••••••"
            required
          >
          <button class="ez-primary-btn" type="submit">دخول</button>
          <p id="ezError" role="alert"></p>
        </form>
      </section>

      <!-- التطبيق الرئيسي -->
      <main id="ezApp">
        <div class="ez-layout">
          <section class="ez-card">
            <h2 id="ezCurrentTitle" class="ez-title">اختر قناة</h2>

            <div id="ezPlayer" class="ez-player">
              <video id="ezVideo" playsinline></video>

              <img
                class="ez-channel-logo"
                src="https://via.placeholder.com/120x50/000000/FFFFFF?text=Logo"
                alt="Logo"
              >

              <div class="ez-live-badge">
                <span></span>مباشر
              </div>

              <!-- لوحة التحكم -->
              <div class="ez-controls">
                <button
                  id="ezPlayBtn"
                  class="ez-icon-btn"
                  type="button"
                  title="تشغيل / إيقاف"
                >
                  <svg id="ezPlayIcon" viewBox="0 0 24 24">
                    <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>
                  </svg>
                </button>

                <div id="ezPlayerMsg" class="ez-msg">اختر قناة لبدء المشاهدة</div>

                <!-- زر تدوير الشاشة بالـ SVG -->
                <button
                  id="ezRotateBtn"
                  class="ez-icon-btn"
                  type="button"
                  title="تدوير الشاشة"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M20 9V4h-5"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M4 15v5h5"></path>
                    <path d="M3 9V4h5"></path>
                    <path d="M21 4l-7 7"></path>
                    <path d="M3 20l7-7"></path>
                  </svg>
                </button>

                <!-- زر ملء الشاشة -->
                <button
                  id="ezFullscreenBtn"
                  class="ez-icon-btn"
                  type="button"
                  title="ملء الشاشة"
                >
                  <svg viewBox="0 0 24 24">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                    <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                    <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                    <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                  </svg>
                </button>
              </div>
            </div>
            <p class="ez-hint">اضغط على المشغل لإظهار/إخفاء الأزرار.</p>
          </section>

          <aside class="ez-card">
            <h2 class="ez-title">القنوات</h2>
            <div id="ezChannels" class="ez-channel-list"></div>
            <button id="ezLogout" class="ez-logout" type="button">تسجيل الخروج</button>
          </aside>
        </div>
      </main>

      <footer class="ez-footer">ezidisport live</footer>
    </div>
  </div>

  <script>
    const EZ_ACCESS_CODE = "181818";

    const ezChannelList = [
      {
        name: "beIN Sport 1",
        url: "http://neo-aps.me/live/Mirza765/97fdfde3c8/263772.m3u8"
      },
      { name: "beIN Sport 2", url: "" },
      { name: "beIN Sport 3", url: "" },
      { name: "Alkass ONE", url: "" }
    ];

    const ezLogin = document.getElementById("ezLogin");
    const ezApp = document.getElementById("ezApp");
    const ezVideo = document.getElementById("ezVideo");
    const ezPlayer = document.getElementById("ezPlayer");
    const ezPlayerMsg = document.getElementById("ezPlayerMsg");
    const ezCurrentTitle = document.getElementById("ezCurrentTitle");
    const ezPlayIcon = document.getElementById("ezPlayIcon");
    const ezRotateBtn = document.getElementById("ezRotateBtn");

    let ezHls = null;
    let ezHideTimer = null;
    let ezIsLandscape = false;

    document.getElementById("ezLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("ezPasscode").value;

      if (code === EZ_ACCESS_CODE) {
        document.getElementById("ezError").textContent = "";
        ezLogin.style.display = "none";
        ezApp.style.display = "block";
        ezRenderChannels();
      } else {
        document.getElementById("ezError").textContent = "رمز الدخول غير صحيح.";
      }
    });

    function ezRenderChannels() {
      const container = document.getElementById("ezChannels");
      container.innerHTML = "";

      ezChannelList.forEach((ch) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ez-ch-btn";
        btn.disabled = !ch.url;

        const name = document.createElement("span");
        name.textContent = ch.name;

        const detail = document.createElement("small");
        detail.textContent = ch.url ? "متاحة — اضغط للتشغيل" : "قريباً";

        btn.append(name, detail);

        if (ch.url) {
          btn.addEventListener("click", () => ezPlayChannel(ch, btn));
        }
        container.appendChild(btn);
      });
    }

    function ezPlayChannel(ch, selectedBtn) {
      if (ezHls) {
        ezHls.destroy();
        ezHls = null;
      }

      document.querySelectorAll(".ez-ch-btn").forEach((b) => b.classList.remove("active"));
      selectedBtn.classList.add("active");

      ezCurrentTitle.textContent = ch.name;
      ezPlayerMsg.textContent = "جارٍ التحميل…";

      ezVideo.pause();
      ezVideo.removeAttribute("src");
      ezVideo.load();

      if (ezVideo.canPlayType("application/vnd.apple.mpegurl")) {
        ezVideo.src = ch.url;
        ezVideo.play().catch(() => { ezPlayerMsg.textContent = "اضغط زر التشغيل"; });
      } else if (window.Hls && Hls.isSupported()) {
        ezHls = new Hls();
        ezHls.loadSource(ch.url);
        ezHls.attachMedia(ezVideo);

        ezHls.on(Hls.Events.MANIFEST_PARSED, () => {
          ezVideo.play().catch(() => { ezPlayerMsg.textContent = "اضغط زر التشغيل"; });
        });

        ezHls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) ezPlayerMsg.textContent = "تعذّر تشغيل البث";
        });
      } else {
        ezPlayerMsg.textContent = "المتصفح لا يدعم التشغيل";
      }

      ezShowControls();
    }

    function ezShowControls() {
      ezPlayer.classList.remove("controls-hidden");
      clearTimeout(ezHideTimer);
      ezHideTimer = setTimeout(() => {
        ezPlayer.classList.add("controls-hidden");
      }, 5000);
    }

    ezPlayer.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      ezShowControls();
    });

    function ezTogglePlayback() {
      if (!ezVideo.src && !ezHls) {
        ezPlayerMsg.textContent = "اختر قناة أولاً";
        return;
      }
      if (ezVideo.paused) {
        ezVideo.play();
      } else {
        ezVideo.pause();
      }
      ezShowControls();
    }

    document.getElementById("ezPlayBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      ezTogglePlayback();
    });

    function ezUpdateIcon() {
      if (ezVideo.paused) {
        ezPlayIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"></polygon>';
      } else {
        ezPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="currentColor"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor"></rect>';
      }
    }

    ezVideo.addEventListener("play", () => { ezPlayerMsg.textContent = "البث يعمل"; ezUpdateIcon(); });
    ezVideo.addEventListener("pause", ezUpdateIcon);
    ezVideo.addEventListener("waiting", () => { ezPlayerMsg.textContent = "جارٍ التحميل…"; });
    ezVideo.addEventListener("playing", () => { ezPlayerMsg.textContent = "البث يعمل"; });

    // تدوير الشاشة
    ezRotateBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        if (screen.orientation && screen.orientation.lock) {
          if (!ezIsLandscape) {
            await screen.orientation.lock("landscape");
            ezIsLandscape = true;
          } else {
            await screen.orientation.lock("portrait");
            ezIsLandscape = false;
          }
        } else {
          ezPlayer.classList.toggle("rotated");
        }
      } catch (err) {
        ezPlayer.classList.toggle("rotated");
      }
      ezShowControls();
    });

    // ملء الشاشة
    document.getElementById("ezFullscreenBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      if (ezPlayer.requestFullscreen) {
        ezPlayer.requestFullscreen().catch(() => {});
      } else if (ezVideo.webkitEnterFullscreen) {
        ezVideo.webkitEnterFullscreen();
      }
      ezShowControls();
    });

    // تسجيل الخروج
    document.getElementById("ezLogout").addEventListener("click", () => {
      clearTimeout(ezHideTimer);
      if (ezHls) { ezHls.destroy(); ezHls = null; }
      ezVideo.pause();
      ezVideo.removeAttribute("src");
      ezVideo.load();

      ezApp.style.display = "none";
      ezLogin.style.display = "block";
      document.getElementById("ezPasscode").value = "";
      document.getElementById("ezError").textContent = "";
      ezPlayer.classList.remove("controls-hidden");
      ezUpdateIcon();
    });
  </script>
</body>
</html>
