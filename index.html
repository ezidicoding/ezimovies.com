<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل ستلايت - أفلام</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #111; color: #eee; font-family: 'Cairo', sans-serif; overflow: hidden; }
.tv {
  display: flex;
  height: 100vh;
  background: #000;
}
/* قائمة القنوات (ستلايت) */
.channels {
  width: 280px;
  background: #1a1a1a;
  border-left: 1px solid #333;
  display: flex;
  flex-direction: column;
  transition: width 0.25s;
}
.channels.collapsed { width: 0; overflow: hidden; }
.ch-header {
  padding: 12px 14px;
  background: #222;
  font-weight: 600;
  font-size: 0.95rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
}
.ch-search {
  margin: 8px 10px;
  padding: 7px 10px;
  background: #111;
  border: 1px solid #444;
  border-radius: 4px;
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  width: calc(100% - 20px);
  outline: none;
}
.ch-list { flex: 1; overflow-y: auto; }
.ch-item {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid #2a2a2a;
  align-items: center;
}
.ch-item:hover { background: #252525; }
.ch-item.active { background: #e50914; color: #fff; }
.ch-item img {
  width: 48px;
  height: 68px;
  object-fit: cover;
  border-radius: 3px;
  background: #333;
  flex-shrink: 0;
}
.ch-item .info { flex: 1; min-width: 0; }
.ch-item .info h4 { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-item .info span { font-size: 0.75rem; opacity: 0.7; }

/* منطقة الفيديو */
.screen {
  flex: 1;
  position: relative;
  background: #000;
  display: flex;
  flex-direction: column;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.top-info {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 10px 16px;
  background: linear-gradient(rgba(0,0,0,0.7), transparent);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1rem;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s;
}
.screen:hover .top-info, .screen.show .top-info { opacity: 1; }
.controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 14px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s;
}
.screen:hover .controls, .screen.show .controls { opacity: 1; }
.progress {
  height: 4px;
  background: #444;
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 10px;
  direction: ltr;
}
.progress-fill { height: 100%; background: #e50914; width: 0%; border-radius: 2px; }
.ctrl-row { display: flex; align-items: center; gap: 8px; }
.btn {
  background: transparent;
  border: none;
  color: #fff;
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.btn:hover { background: rgba(255,255,255,0.15); }
.btn svg { width: 22px; height: 22px; fill: currentColor; }
.time { font-size: 0.8rem; min-width: 90px; text-align: center; }
.loader {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 40px; height: 40px;
  border: 3px solid #333; border-top-color: #e50914;
  border-radius: 50%; animation: spin 0.7s linear infinite;
  display: none; z-index: 10;
}
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
.error {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.8); padding: 16px; border-radius: 6px;
  display: none; text-align: center; z-index: 10;
}
@media (max-width: 700px) {
  .channels { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: 260px; }
  .channels.collapsed { transform: translateX(100%); width: 260px; }
}
</style>
</head>
<body>
<div class="tv">
  <aside class="channels" id="channels">
    <div class="ch-header">
      <span>القنوات</span>
      <button class="btn" id="toggleCh" style="width:32px;height:32px">☰</button>
    </div>
    <input type="text" class="ch-search" id="search" placeholder="بحث...">
    <div class="ch-list" id="chList"></div>
  </aside>

  <div class="screen" id="screen">
    <video id="video" playsinline crossorigin="anonymous"></video>
    <div class="loader" id="loader"></div>
    <div class="error" id="error">تعذر تشغيل الفيديو</div>

    <div class="top-info">
      <div id="nowPlaying">--</div>
      <button class="btn" id="openCh">☰</button>
    </div>

    <div class="controls">
      <div class="progress" id="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="ctrl-row">
        <button class="btn" id="prev">◀</button>
        <button class="btn" id="playPause">
          <svg id="playIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIco" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn" id="next">▶</button>
        <div class="time" id="time">0:00 / 0:00</div>
        <button class="btn" id="cc" title="ترجمة">CC</button>
        <button class="btn" id="fs">⛶</button>
      </div>
    </div>
  </div>
</div>

<script>
let movies = [];
let current = 0;
let subsOn = true;

const video = document.getElementById('video');
const chList = document.getElementById('chList');
const search = document.getElementById('search');
const channels = document.getElementById('channels');
const screen = document.getElementById('screen');
const loader = document.getElementById('loader');
const error = document.getElementById('error');
const nowPlaying = document.getElementById('nowPlaying');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const timeEl = document.getElementById('time');
const playIco = document.getElementById('playIco');
const pauseIco = document.getElementById('pauseIco');

async function loadData() {
  try {
    const r = await fetch('datamov.json');
    movies = await r.json();
    renderChannels();
    if (movies.length) play(0);
  } catch (e) {
    chList.innerHTML = '<div style="padding:20px;color:#f66">تعذر تحميل datamov.json<br>شغّل الملف عبر سيرفر محلي</div>';
  }
}

function renderChannels(filter = '') {
  chList.innerHTML = '';
  movies.forEach((m, i) => {
    if (filter && !m.titleAr.includes(filter) && !m.title.toLowerCase().includes(filter.toLowerCase())) return;
    const div = document.createElement('div');
    div.className = 'ch-item' + (i === current ? ' active' : '');
    div.innerHTML = `<img src="${m.poster}" onerror="this.style.background='#444'"><div class="info"><h4>${m.titleAr}</h4><span>${m.year}</span></div>`;
    div.onclick = () => { play(i); if (window.innerWidth < 700) channels.classList.add('collapsed'); };
    chList.appendChild(div);
  });
}

function srtToVtt(srt) {
  // تحويل SRT إلى WebVTT
  let text = srt.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  if (text.startsWith('WEBVTT')) return text;
  // استبدال الفاصلة بنقطة في التوقيتات
  text = text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
  return 'WEBVTT\n\n' + text;
}

async function loadSubtitles(m) {
  if (!m.srt || !m.srt.trim()) return;
  try {
    const resp = await fetch(m.srt);
    if (!resp.ok) {
      console.warn('فشل تحميل الترجمة:', resp.status);
      return;
    }
    let content = await resp.text();
    // إذا كان SRT أو لا يبدأ بـ WEBVTT، حوّله
    if (m.srt.toLowerCase().includes('.srt') || !content.trim().toUpperCase().startsWith('WEBVTT')) {
      content = srtToVtt(content);
    }
    const blob = new Blob([content], { type: 'text/vtt' });
    const blobUrl = URL.createObjectURL(blob);

    const t = document.createElement('track');
    t.kind = 'subtitles';
    t.srclang = 'ar';
    t.label = 'ترجمة عربية';
    t.src = blobUrl;
    t.default = subsOn;
    video.appendChild(t);

    // تفعيل الترجمة بعد تحميلها
    t.addEventListener('load', () => {
      const tracks = video.textTracks;
      if (tracks.length > 0) {
        tracks[0].mode = subsOn ? 'showing' : 'hidden';
      }
    });
    // في حال كان الـ track جاهزاً بسرعة
    setTimeout(() => {
      if (video.textTracks.length && video.textTracks[0].mode !== (subsOn ? 'showing' : 'hidden')) {
        video.textTracks[0].mode = subsOn ? 'showing' : 'hidden';
      }
    }, 500);
  } catch (e) {
    console.warn('خطأ في الترجمة:', e);
  }
}

function play(i) {
  if (i < 0 || i >= movies.length) return;
  current = i;
  const m = movies[i];
  error.style.display = 'none';
  loader.style.display = 'block';
  // إزالة الترجمات القديمة
  video.querySelectorAll('track').forEach(t => t.remove());
  // إلغاء أي blob قديم (اختياري)
  video.src = m.src;
  video.load();
  nowPlaying.textContent = m.titleAr;
  renderChannels(search.value);
  // تحميل الترجمة
  loadSubtitles(m);
  video.play().catch(() => {});
}

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

video.onwaiting = () => loader.style.display = 'block';
video.onplaying = () => loader.style.display = 'none';
video.onerror = () => { loader.style.display = 'none'; error.style.display = 'block'; };
video.ontimeupdate = () => {
  timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  if (video.duration) progressFill.style.width = (video.currentTime / video.duration * 100) + '%';
};
video.onplay = () => { playIco.style.display = 'none'; pauseIco.style.display = 'block'; };
video.onpause = () => { playIco.style.display = 'block'; pauseIco.style.display = 'none'; };
video.onended = () => { if (current < movies.length - 1) play(current + 1); };

progress.onclick = e => {
  const r = progress.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  if (video.duration) video.currentTime = p * video.duration;
};

document.getElementById('playPause').onclick = () => video.paused ? video.play() : video.pause();
document.getElementById('prev').onclick = () => play(current - 1);
document.getElementById('next').onclick = () => play(current + 1);
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : screen.requestFullscreen();
document.getElementById('cc').onclick = () => {
  subsOn = !subsOn;
  if (video.textTracks[0]) video.textTracks[0].mode = subsOn ? 'showing' : 'hidden';
  document.getElementById('cc').style.color = subsOn ? '#e50914' : '#fff';
};
document.getElementById('toggleCh').onclick = () => channels.classList.toggle('collapsed');
document.getElementById('openCh').onclick = () => channels.classList.toggle('collapsed');
search.oninput = () => renderChannels(search.value);

let hideT;
function showUI() {
  screen.classList.add('show');
  clearTimeout(hideT);
  hideT = setTimeout(() => { if (!video.paused) screen.classList.remove('show'); }, 2500);
}
screen.onmousemove = showUI;
screen.ontouchstart = showUI;

document.onkeydown = e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  if (e.key === 'ArrowRight') play(current + 1);
  if (e.key === 'ArrowLeft') play(current - 1);
  if (e.key === 'ArrowUp') video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
  if (e.key === 'ArrowDown') video.currentTime = Math.max(0, video.currentTime - 10);
  if (e.key.toLowerCase() === 'f') document.getElementById('fs').click();
  if (e.key.toLowerCase() === 'm') channels.classList.toggle('collapsed');
  showUI();
};

loadData();
</script>
</body>
</html>
