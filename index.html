<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EZIDITV - Smart IPTV Player</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- VideoJS Player Professional -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); }
        .tv-focusable:focus, .tv-focusable:hover {
            outline: none;
            border-color: #f59e0b !important;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen font-sans antialiased selection:bg-amber-500 overflow-x-hidden">

    <!-- ==================== 1. شاشة تسجيل الدخول وإدخال السيرفر ==================== -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/20 via-gray-950 to-black">
        <div class="w-full max-w-md glass-panel border border-amber-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
            
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-amber-500 to-yellow-600 text-gray-950 rounded-2xl mb-3 shadow-lg shadow-amber-500/20 font-black text-2xl">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-white">EZIDITV Satellite</h1>
                <p class="text-gray-400 text-xs mt-1">الرجاء إدخال بيانات اشتراكك للمتابعة</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3.5">
                <div>
                    <label class="block text-gray-300 text-xs font-semibold mb-1">اسم القائمة (اختياري)</label>
                    <input type="text" id="playlistName" placeholder="My Playlist" 
                        class="w-full bg-gray-900 border border-gray-700/80 text-white rounded-xl py-2.5 px-3 text-xs focus:border-amber-500 outline-none tv-focusable">
                </div>

                <div>
                    <label class="block text-gray-300 text-xs font-semibold mb-1">اسم المستخدم (UserName)</label>
                    <input type="text" id="username" required placeholder="UserName" 
                        class="w-full bg-gray-900 border border-gray-700/80 text-white rounded-xl py-2.5 px-3 text-xs focus:border-amber-500 outline-none tv-focusable">
                </div>

                <div>
                    <label class="block text-gray-300 text-xs font-semibold mb-1">كلمة المرور (PassWord)</label>
                    <input type="password" id="password" required placeholder="PassWord" 
                        class="w-full bg-gray-900 border border-gray-700/80 text-white rounded-xl py-2.5 px-3 text-xs focus:border-amber-500 outline-none tv-focusable">
                </div>

                <div>
                    <label class="block text-gray-300 text-xs font-semibold mb-1">رابط السيرفر (Server: http://example.com:8080)</label>
                    <input type="text" id="hostUrl" required placeholder="http://yourserver.com:8080" 
                        class="w-full bg-gray-900 border border-gray-700/80 text-white rounded-xl py-2.5 px-3 text-xs focus:border-amber-500 outline-none tv-focusable">
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-gray-950 font-extrabold py-3 rounded-xl shadow-lg shadow-amber-500/20 transition text-xs mt-2 flex items-center justify-center gap-2 tv-focusable">
                    <i class="fa-solid fa-play"></i> اتصال بالستلايت
                </button>
            </form>
        </div>
    </div>

    <!-- ==================== 2. الداشبورد وعرض القنوات ==================== -->
    <div id="dashboardSection" class="hidden min-h-screen flex flex-col bg-gray-950">
        
        <!-- الشريط العلوي -->
        <header class="glass-panel border-b border-gray-800 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between sticky top-0 z-50 gap-3">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 bg-amber-500 rounded-xl flex items-center justify-center font-black text-gray-950 shadow-md" id="headerPlaylistInitial">E</div>
                <div>
                    <h2 class="font-black text-lg tracking-wider" id="headerPlaylistTitle">EZIDITV</h2>
                    <span class="text-[10px] text-emerald-400 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> متصل بالسيرفر
                    </span>
                </div>
            </div>

            <!-- أقسام البث -->
            <nav class="flex items-center gap-1.5 overflow-x-auto py-1 max-w-full custom-scrollbar">
                <button onclick="switchCategory('live')" id="tab-live" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition tv-focusable bg-amber-500 text-gray-950">
                    <i class="fa-solid fa-tv ml-1"></i> البث المباشر (Live)
                </button>
                <button onclick="switchCategory('vod')" id="tab-vod" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition tv-focusable text-gray-400 hover:text-white">
                    <i class="fa-solid fa-film text-blue-400 ml-1"></i> الأفلام (Movies)
                </button>
                <button onclick="switchCategory('series')" id="tab-series" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition tv-focusable text-gray-400 hover:text-white">
                    <i class="fa-solid fa-clapperboard text-purple-400 ml-1"></i> المسلسلات (Series)
                </button>
            </nav>

            <div class="flex items-center gap-2">
                <button onclick="showLoginSettings()" title="تعديل بيانات السيرفر" class="px-3 py-1.5 bg-amber-500/20 text-amber-400 hover:bg-amber-500 hover:text-gray-950 rounded-xl text-xs font-bold transition tv-focusable">
                    <i class="fa-solid fa-gear"></i> الإعدادات
                </button>
                <button onclick="logout()" title="تسجيل الخروج" class="px-3 py-1.5 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-xl text-xs font-bold transition tv-focusable">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 max-w-[1920px] mx-auto w-full">
            
            <!-- مشغل الفيديو -->
            <div class="lg:col-span-8 flex flex-col space-y-3">
                <div class="bg-black rounded-3xl overflow-hidden border border-amber-500/30 shadow-2xl relative aspect-video">
                    <video id="mainPlayer" class="video-js vjs-default-skin vjs-big-play-centered w-full h-full" controls preload="auto">
                    </video>
                </div>

                <div class="glass-panel border border-gray-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h3 id="currentStreamTitle" class="text-base font-bold">اختر قناة أو فيلماً للمشاهدة</h3>
                        <p id="currentStreamCategory" class="text-xs text-gray-400 mt-0.5">EZIDITV Satellite Receiver</p>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-amber-500 text-gray-950 hover:bg-amber-400 rounded-lg text-xs font-bold transition tv-focusable"><i class="fa-solid fa-expand"></i> ملء الشاشة</button>
                    </div>
                </div>
            </div>

            <!-- قائمة القنوات والبحث (10 عناصر في الصفحة) -->
            <div class="lg:col-span-4 glass-panel border border-gray-800 rounded-3xl p-4 flex flex-col h-[580px] lg:h-auto justify-between">
                <div>
                    <div class="mb-3">
                        <input type="text" id="searchInput" oninput="filterChannels()" placeholder="بحث سريع في القنوات..." 
                            class="w-full bg-gray-900 border border-gray-700/80 text-white rounded-xl py-2 px-3 text-xs focus:border-amber-500 outline-none tv-focusable">
                    </div>

                    <div id="channelsList" class="overflow-y-auto space-y-2 pr-1 custom-scrollbar max-h-[420px]"></div>
                </div>

                <!-- أزرار التنقل بين الصفحات -->
                <div id="paginationControls" class="hidden items-center justify-between pt-3 border-t border-gray-800 mt-2">
                    <button onclick="changePage(-1)" id="prevPageBtn" class="px-3 py-1.5 bg-amber-900/40 hover:bg-amber-500 hover:text-gray-950 text-xs rounded-xl transition font-bold tv-focusable disabled:opacity-40">
                        <i class="fa-solid fa-chevron-right ml-1"></i> السابق
                    </button>
                    <span id="pageIndicator" class="text-xs text-amber-300 font-bold">صفحة 1</span>
                    <button onclick="changePage(1)" id="nextPageBtn" class="px-3 py-1.5 bg-amber-900/40 hover:bg-amber-500 hover:text-gray-950 text-xs rounded-xl transition font-bold tv-focusable disabled:opacity-40">
                        التالي <i class="fa-solid fa-chevron-left mr-1"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Script التشغيل والاتصال بالسيرفر -->
    <script>
        let player = videojs('mainPlayer');
        let currentAccount = { host: '', username: '', password: '', playlistName: '' };
        let allStreams = [];
        let filteredStreams = [];
        let currentCategory = 'live';
        let currentPage = 1;
        const itemsPerPage = 10; 

        window.onload = function() {
            let h = localStorage.getItem('ez_host');
            let u = localStorage.getItem('ez_user');
            let p = localStorage.getItem('ez_pass');
            let n = localStorage.getItem('ez_name');

            // إذا لم يتم إدخال البيانات مسبقاً، نظهر شاشة تسجيل الدخول فقط
            if (!h || !u || !p) {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
            } else {
                currentAccount = { host: h, username: u, password: p, playlistName: n || 'EZIDITV' };
                showDashboard();
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            let host = document.getElementById('hostUrl').value.trim();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const name = document.getElementById('playlistName').value.trim() || 'EZIDITV';
            
            if (host.endsWith('/')) host = host.slice(0, -1);

            localStorage.setItem('ez_host', host);
            localStorage.setItem('ez_user', user);
            localStorage.setItem('ez_pass', pass);
            localStorage.setItem('ez_name', name);

            currentAccount = { host, username: user, password: pass, playlistName: name };
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            
            const pName = currentAccount.playlistName || 'EZIDITV';
            document.getElementById('headerPlaylistTitle').innerText = pName;
            document.getElementById('headerPlaylistInitial').innerText = pName.charAt(0).toUpperCase();

            switchCategory('live');
        }

        function showLoginSettings() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            
            document.getElementById('hostUrl').value = currentAccount.host;
            document.getElementById('username').value = currentAccount.username;
            document.getElementById('password').value = currentAccount.password;
            document.getElementById('playlistName').value = currentAccount.playlistName;
        }

        function switchCategory(cat) {
            currentCategory = cat;
            currentPage = 1; 
            const tabs = ['live', 'vod', 'series'];
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) {
                    if (t === cat) {
                        btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition tv-focusable bg-amber-500 text-gray-950";
                    } else {
                        btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition tv-focusable text-gray-400 hover:text-white";
                    }
                }
            });

            loadStreams(cat);
        }

        async function loadStreams(category) {
            const listContainer = document.getElementById('channelsList');
            listContainer.innerHTML = '<div class="text-center text-amber-400 py-8"><i class="fa-solid fa-circle-notch fa-spin text-xl mb-2"></i><br><span class="text-xs">جاري تحميل القنوات من سيرفرك...</span></div>';

            let action = 'get_live_streams';
            if (category === 'vod') action = 'get_vod_streams';
            if (category === 'series') action = 'get_series';

            try {
                const url = `${currentAccount.host}/player_api.php?username=${currentAccount.username}&password=${currentAccount.password}&action=${action}`;
                const res = await fetch(url);
                const data = await res.json();

                if (Array.isArray(data)) {
                    allStreams = data;
                } else {
                    allStreams = [];
                }
            } catch (err) {
                allStreams = [];
                listContainer.innerHTML = '<div class="text-center text-red-400 py-8 text-xs">فشل الاتصال بالسيرفر أو تحقق من صحة البيانات الرابط/الخادم</div>';
                return;
            }

            filteredStreams = allStreams;
            renderPaginationView();
        }

        function renderPaginationView() {
            const paginationEl = document.getElementById('paginationControls');
            
            if (filteredStreams.length > itemsPerPage) {
                paginationEl.classList.remove('hidden');
                paginationEl.classList.add('flex');
            } else {
                paginationEl.classList.add('hidden');
                paginationEl.classList.remove('flex');
            }

            const totalPages = Math.ceil(filteredStreams.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            document.getElementById('pageIndicator').innerText = `صفحة ${currentPage} من ${totalPages}`;
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages || totalPages === 0;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredStreams.slice(start, end);

            renderStreams(paginatedItems);
        }

        function changePage(direction) {
            currentPage += direction;
            renderPaginationView();
            document.getElementById('channelsList').scrollTop = 0;
        }

        function renderStreams(items) {
            const listContainer = document.getElementById('channelsList');
            listContainer.innerHTML = '';

            if (!Array.isArray(items) || items.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-500 py-10 text-xs">لا توجد قنوات متاحة</div>';
                return;
            }

            items.forEach(item => {
                const title = item.name || 'قناة غير معروفة';
                const icon = item.stream_icon || '';
                const id = item.stream_id || item.series_id || '0';
                const ext = item.container_extension || 'mp4';

                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-2.5 hover:bg-amber-500/10 rounded-2xl cursor-pointer transition border border-transparent hover:border-amber-500/30 tv-focusable";
                div.tabIndex = 0;
                div.onclick = () => playStream(title, id, ext);

                div.innerHTML = `
                    <img src="${icon}" onerror="this.src='https://via.placeholder.com/120/1e1b4b/ffffff?text=TV'" class="w-10 h-10 rounded-xl object-cover bg-gray-900">
                    <div class="flex-1 truncate">
                        <h4 class="text-xs font-bold truncate">${title}</h4>
                        <span class="text-[10px] text-amber-400">قناة رقمية</span>
                    </div>
                    <i class="fa-solid fa-play text-amber-400 text-xs"></i>
                `;
                listContainer.appendChild(div);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredStreams = allStreams.filter(s => (s.name || '').toLowerCase().includes(query));
            currentPage = 1; 
            renderPaginationView();
        }

        function playStream(title, streamId, extension) {
            document.getElementById('currentStreamTitle').innerText = title;
            document.getElementById('currentStreamCategory').innerText = `جاري العرض المباشر من الستلايت`;

            let streamURL = '';
            if (currentCategory === 'live') {
                streamURL = `${currentAccount.host}/live/${currentAccount.username}/${currentAccount.password}/${streamId}.m3u8`;
            } else if (currentCategory === 'vod') {
                streamURL = `${currentAccount.host}/movie/${currentAccount.username}/${currentAccount.password}/${streamId}.${extension}`;
            } else {
                streamURL = `${currentAccount.host}/series/${currentAccount.username}/${currentAccount.password}/${streamId}.mp4`;
            }

            player.src({
                src: streamURL,
                type: currentCategory === 'live' ? 'application/x-mpegURL' : 'video/mp4'
            });
            player.play();
        }

        function toggleFullscreen() { player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen(); }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
