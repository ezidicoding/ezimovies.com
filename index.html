<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشغل الستلايت السينمائي المتطور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<!-- مكتبة HLS لدعم تشغيل قنوات m3u8 و m3u -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: 'Cairo', sans-serif; overflow: hidden; }

.tv-box { display: flex; width: 100vw; height: 100vh; background: #0b0b0b; }

/* قائمة القنوات الخفيفة */
.channels-panel {
  width: 280px;
  background: #141414;
  border-left: 1px solid #222;
  display: flex;
  flex-direction: column;
  transition: width 0.2s ease;
  z-index: 30;
}
.channels-panel.hidden { width: 0; overflow: hidden; }

.panel-header {
  padding: 14px;
  background: #1c1c1c;
  font-weight: 700;
  font-size: 0.95rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #282828;
}

.search-input {
  margin: 10px;
  padding: 8px 12px;
  background: #090909;
  border: 1px solid #333;
  border-radius: 4px;
  color: #fff;
  font-family: inherit;
  font-size: 0.85rem;
  width: calc(100% - 20px);
  outline: none;
}
.search-input:focus { border-color: #e50914; }

.channels-list { flex: 1; overflow-y: auto; }
.channels-list::-webkit-scrollbar { width: 4px; }
.channels-list::-webkit-scrollbar-thumb { background: #333; }

.channel-item {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid #1a1a1a;
  align-items: center;
}
.channel-item:hover { background: #1f1f1f; }
.channel-item.active { background: #e50914; color: #fff; }

.channel-item img {
  width: 42px;
  height: 60px;
  object-fit: cover;
  border-radius: 3px;
  background: #222;
  flex-shrink: 0;
}
.channel-info { flex: 1; min-width: 0; }
.channel-info h4 { font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.channel-info span { font-size: 0.75rem; opacity: 0.7; }

/* شاشة العرض الحاوية للفيديو */
.screen-panel {
  flex: 1;
  position: relative;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* حاوية الفيديو لضمان التمركز وتحديد مساحة الترجمة فوق الفيديو بدقة */
.video-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

/* طبقة الترجمة الموضعية تماماً فوق مساحة الفيديو وليس أسفل الشاشة الكلية */
.subtitles-layer {
  position: absolute;
  bottom: 8%; /* تظهر فوق حافة الفيديو مباشرة */
  left: 10%;
  right: 10%;
  text-align: center;
  font-family: 'Cairo', sans-serif;
  font-size: clamp(15px, 2.2vw, 28px);
  font-weight: 700;
  line-height: 1.4;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 10;
}
.subtitles-layer span {
  display: inline-block;
  background: rgba(0, 0, 0, 0.7);
  padding: 4px 14px;
  border-radius: 4px;
  max-width: 85%;
  word-wrap: break-word;
  white-space: pre-line;
}

/* الشريط العلوي والسفلي للتحكم */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 12px 20px;
  background: linear-gradient(rgba(0,0,0,0.8), transparent);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.2s;
}
.screen-panel:hover .top-bar, .screen-panel.show-ui .top-bar { opacity: 1; }

.bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px 15px 15px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  z-index: 20;
  opacity: 0;
  transition: opacity 0.2s;
}
.screen-panel:hover .bottom-bar, .screen-panel.show-ui .bottom-bar { opacity: 1; }

.progress-track {
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 8px;
  direction: ltr;
}
.progress-bar { height: 100%; background: #e50914; width: 0%; border-radius: 2px; }

.controls-flex { display: flex; align-items: center; gap: 8px; }

.flat-btn {
  background: transparent;
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 4px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem;
}
.flat-btn:hover { background: rgba(255,255,255,0.1); }
.flat-btn svg { width: 18px; height: 18px; fill: currentColor; }

.time-text { font-size: 0.8rem; opacity: 0.8; min-width: 85px; text-align: center; direction: ltr; }

.spinner {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 36px; height: 36px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #e50914;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
  z-index: 25;
}
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

@media (max-width: 700px) {
  .channels-panel { position: absolute; right: 0; top: 0; bottom: 0; }
  .channels-panel.hidden { transform: translateX(100%); width: 280px; }
}
</style>
</head>
<body>

<div class="tv-box">
  <!-- قائمة القنوات -->
  <aside class="channels-panel" id="channelsPanel">
    <div class="panel-header">
      <span>قنوات الستلايت</span>
      <button class="flat-btn" id="togglePanelBtn">✕</button>
    </div>
    <input type="text" class="search-input" id="searchBox" placeholder="بحث سريع...">
    <div class="channels-list" id="channelsList"></div>
  </aside>

  <!-- شاشة العرض -->
  <div class="screen-panel" id="screenPanel">
    <div class="video-wrapper">
      <video id="videoPlayer" playsinline crossorigin="anonymous"></video>
      <div class="subtitles-layer" id="subtitlesLayer"></div>
    </div>
    
    <div class="spinner" id="loadingSpinner"></div>

    <div class="top-bar">
      <span id="nowPlayingTitle" style="font-weight:600; font-size:0.95rem;">--</span>
      <button class="flat-btn" id="openPanelBtn">☰ القنوات</button>
    </div>

    <div class="bottom-bar">
      <div class="progress-track" id="progressTrack">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="controls-flex">
        <button class="flat-btn" id="prevBtn" title="السابق">◀</button>
        <button class="flat-btn" id="playPauseBtn">
          <svg id="playSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseSvg" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="flat-btn" id="nextBtn" title="التالي">▶</button>
        <div class="time-text" id="timeText">0:00 / 0:00</div>
        <div style="flex:1"></div>
        <button class="flat-btn" id="ccBtn" title="الترجمة" style="font-weight:700; font-size:0.8rem;">CC</button>
        <button class="flat-btn" id="fsBtn" title="ملء الشاشة">⛶</button>
      </div>
    </div>
  </div>
</div>

<script>
let playlist = [];
let currentIndex = 0;
let subsEnabled = true;
let hlsInstance = null;

const video = document.getElementById('videoPlayer');
const channelsList = document.getElementById('channelsList');
const searchBox = document.getElementById('searchBox');
const channelsPanel = document.getElementById('channelsPanel');
const screenPanel = document.getElementById('screenPanel');
const loadingSpinner = document.getElementById('loadingSpinner');
const nowPlayingTitle = document.getElementById('nowPlayingTitle');
const progressTrack = document.getElementById('progressTrack');
const progressBar = document.getElementById('progressBar');
const timeText = document.getElementById('timeText');
const playSvg = document.getElementById('playSvg');
const pauseSvg = document.getElementById('pauseSvg');
const subtitlesLayer = document.getElementById('subtitlesLayer');

function renderSubtitles() {
  if (!subsEnabled) {
    subtitlesLayer.innerHTML = '';
    return;
  }
  const tracks = video.textTracks;
  if (!tracks.length) return;
  let text = '';
  const activeCues = tracks[0].activeCues;
  if (activeCues) {
    for (let i = 0; i < activeCues.length; i++) {
      text += (text ? '\n' : '') + activeCues[i].text;
    }
  }
  subtitlesLayer.innerHTML = text ? `<span>${text.replace(/\n/g, '<br>')}</span>` : '';
}

async function loadData() {
  try {
    const res = await fetch('datamov.json');
    playlist = await res.json();
    renderChannels();
    if (playlist.length) playChannel(0);
  } catch (err) {
    channelsList.innerHTML = '<div style="padding:15px; color:#e50914; font-size:0.85rem;">تعذر تحميل datamov.json</div>';
  }
}

function renderChannels(filter = '') {
  channelsList.innerHTML = '';
  playlist.forEach((item, index) => {
    if (filter && !item.titleAr.includes(filter) && !item.title.toLowerCase().includes(filter.toLowerCase())) return;
    const div = document.createElement('div');
    div.className = 'channel-item' + (index === currentIndex ? ' active' : '');
    div.innerHTML = `
      <img src="${item.poster}" onerror="this.style.background='#333'">
      <div class="channel-info">
        <h4>${item.titleAr}</h4>
        <span>${item.year}</span>
      </div>
    `;
    div.onclick = () => {
      playChannel(index);
      if (window.innerWidth <= 700) channelsPanel.classList.add('hidden');
    };
    channelsList.appendChild(div);
  });
}

function convertSrt(srtData) {
  let text = srtData.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  if (text.startsWith('WEBVTT')) return text;
  text = text.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
  return 'WEBVTT\n\n' + text;
}

async function loadSubtitlesFile(item) {
  if (!item.srt || !item.srt.trim()) return;
  try {
    const res = await fetch(item.srt);
    if (!res.ok) return;
    let content = await res.text();
    if (item.srt.toLowerCase().includes('.srt') || !content.trim().toUpperCase().startsWith('WEBVTT')) {
      content = convertSrt(content);
    }
    const blob = new Blob([content], { type: 'text/vtt' });
    const blobUrl = URL.createObjectURL(blob);

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = 'ar';
    track.label = 'Arabic';
    track.src = blobUrl;
    video.appendChild(track);

    const setupTrack = () => {
      if (video.textTracks.length > 0) {
        video.textTracks[0].mode = 'hidden';
        video.textTracks[0].oncuechange = renderSubtitles;
        renderSubtitles();
      }
    };
    track.addEventListener('load', setupTrack);
    setTimeout(setupTrack, 200);
  } catch (e) {
    console.warn('Subtitle load error', e);
  }
}

function playChannel(index) {
  if (index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const item = playlist[index];
  
  loadingSpinner.style.display = 'block';
  video.querySelectorAll('track').forEach(t => t.remove());
  subtitlesLayer.innerHTML = '';

  // تنظيف أي بث HLS سابق
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  const srcUrl = item.src;

  // التحقق مما إذا كان الرابط يدعم m3u8 أو m3u
  if (srcUrl.includes('.m3u8') || srcUrl.includes('.m3u')) {
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(srcUrl);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = srcUrl;
      video.play().catch(() => {});
    }
  } else {
    // تشغيل ملفات MP4 العادية
    video.src = srcUrl;
    video.load();
    video.play().catch(() => {});
  }

  nowPlayingTitle.textContent = item.titleAr;
  renderChannels(searchBox.value);
  loadSubtitlesFile(item);
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

video.onwaiting = () => loadingSpinner.style.display = 'block';
video.onplaying = () => loadingSpinner.style.display = 'none';
video.onerror = () => loadingSpinner.style.display = 'none';
video.ontimeupdate = () => {
  timeText.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  if (video.duration) progressBar.style.width = (video.currentTime / video.duration) * 100 + '%';
  renderSubtitles();
};
video.onplay = () => { playSvg.style.display = 'none'; pauseSvg.style.display = 'block'; };
video.onpause = () => { playSvg.style.display = 'block'; pauseSvg.style.display = 'none'; };
video.onended = () => { if (currentIndex < playlist.length - 1) playChannel(currentIndex + 1); };

progressTrack.onclick = e => {
  const rect = progressTrack.getBoundingClientRect();
  const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (video.duration) video.currentTime = pos * video.duration;
};

document.getElementById('playPauseBtn').onclick = () => video.paused ? video.play() : video.pause();
document.getElementById('prevBtn').onclick = () => playChannel(currentIndex - 1);
document.getElementById('nextBtn').onclick = () => playChannel(currentIndex + 1);
document.getElementById('fsBtn').onclick = () => {
  if (!document.fullscreenElement) screenPanel.requestFullscreen();
  else document.exitFullscreen();
};
document.getElementById('ccBtn').onclick = () => {
  subsEnabled = !subsEnabled;
  document.getElementById('ccBtn').style.color = subsEnabled ? '#e50914' : '#fff';
  renderSubtitles();
};

document.getElementById('togglePanelBtn').onclick = () => channelsPanel.classList.toggle('hidden');
document.getElementById('openPanelBtn').onclick = () => channelsPanel.classList.toggle('hidden');
searchBox.oninput = e => renderChannels(e.target.value);

let uiTimer;
function showUI() {
  screenPanel.classList.add('show-ui');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => {
    if (!video.paused) screenPanel.classList.remove('show-ui');
  }, 2500);
}
screenPanel.onmousemove = showUI;
screenPanel.ontouchstart = showUI;

loadData();
</script>
</body>
</html>
